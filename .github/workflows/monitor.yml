name: Stock Market Monitor

on:
  schedule:
    # اجرا در ساعت ۱۰ صبح و ۵ عصر به وقت تهران
    - cron: '30 6,13 * * *'
  workflow_dispatch: # این گزینه بهت اجازه میده دستی هم اجراش کنی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python main.py
